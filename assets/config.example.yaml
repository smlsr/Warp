# Live state stays in the working copy and is gitignored.
# Use an absolute path to keep it outside the repo, for example
# /Users/you/.warp/humanifyos
stateDir: .warp

model: claude-sonnet-5-5-high
# Cursor model slug for coding steps. Claude Sonnet 5.5 High.
# The slug must match the Cursor model picker. Override it here.

maxAgents: 18
# Concurrent Shuttles. No per-person cap.

autoMergeSizes: [S, M]
# S and M auto-merge after Bugbot and CI. L and XL wait.

messenger: both
# slack | teams | both
notify: verbose
# verbose | quiet
runner: cloud
# cloud = Cursor cloud agent VM. local = this machine's agent.
# To run on this machine, comment out the line above and uncomment the next.
# runner: local

jiraProject: ""
# Jira project key, for example WAR. Leave this empty: /warp-init and /warp-scan
# fill it when one prefix is clear, and Jira can confirm it when connected.
# A plan id is a Jira issue only when its prefix matches this or jiraKeyPrefixes.
# WV-01 is not WAR-1. Set it by hand only when the warning lists several candidates:
# python3 scripts/jira_sync.py project --set WAR
jiraKeyPrefixes: ""
# Extra project prefixes, comma-separated, that confirm a Jira key.
# jiraKeyPrefixes: "WAR, HOS"
jiraKeyMap: {}
# Optional plan-id to issue-key map. .warp/jira-map.json is merged on top.
# jiraKeyMap: {"WV-01": "WAR-1"}
jiraExternalIdField: externalId
# Field name or customfield id matched to the plan id. Tried first, then
# External ID, External Id, ExternalId, External Key, Plan ID, and Ticket ID.
# A label warp:<id> and a remote-link id are next. One exact hit is stored.
# A summary match waits for confirmation. Two matches are reported, not picked.
# jiraExternalIdField: "External ID"
# jiraExternalIdField: customfield_10050
jiraTransition: true
# On claim, move the Jira issue to In Progress. Only tickets with a Jira key.
# Needs the Jira MCP server; without it Warp logs a note and the claim goes on.
jiraInProgressStatus: "In Progress"
# Target status name. The transition is looked up by name or status category.
jiraRestoreOnRelease: false
# true: when a claim is released back to queued, move the issue back to the status
# it had before. false: leave it. Pause and stop never move an issue.
jiraQaReadyStatus: "QA Ready"
# Manual path (L and XL by default, any ticket with autoMerge false): the issue moves
# here when it is ready for a person to review and merge. Warp does not move it to
# Done after that; QA does.
jiraDoneStatus: "Done"
# Auto-merge path (S and M by default): the issue moves here after the merge.
jiraSite: ""
# Atlassian site URL, for example https://yoursite.atlassian.net. Passed as cloudId
# when you have more than one site. Empty: look the site up with getAccessibleAtlassianResources.
bugbotRequired: true
maxFixAttempts: 3
stuckAfterMinutes: 90
respectMergeWindows: false
mergeWindows: ["08:30", "13:00", "17:00"]
pollSeconds: 300

jiraMcp: atlassian
gitProvider: auto
# auto | github | bitbucket. auto reads the host of the origin remote, and
# /warp-init writes the one it finds. Other hosts run local-only.
# Uncomment one of these to force a provider, and comment out the line above.
# gitProvider: github
# gitProvider: bitbucket
githubMcp: github
bitbucketMcp: bitbucket
ghCli: true
# GitHub only: use the gh CLI when no GitHub server is connected, if gh is
# installed and logged in. Warp never installs gh or logs in.
# Uncomment to never try the gh CLI.
# ghCli: false
pushMerge: true
# true: connected mode, push branches, open and merge PRs through the provider.
# false: local-only. Never push, never open PRs, never call a provider; merge
# ticket branches into baseBranch with local git. No remote also means local.
# Uncomment for local-only: never push and never open a pull request.
# pushMerge: false
baseBranch: ""
# Branch tickets start from and merge into. Empty uses origin's default, then main or master.
# Uncomment to branch and merge into develop instead of the detected default.
# baseBranch: "develop"
slackMcp: slack
teamsMcp: teams
slackChannel: "warp"
teamsChannel: "warp"
# Channel to post into, and to watch for warp:status. One shared channel for
# every repo; each message names its repo in the header. Warp does not create
# the channel. Create it once, or change these to a channel that exists.
# Use lowercase: Slack channel names are lowercase.
projectName: ""
# Shown in message headers after the repo: "Warp | repo / project".
# Empty uses jiraProject, then the workspace folder name.
notifyAllow: []
# Extra MCP tools that may run without a Run prompt. Each entry is "server:tool".
# No wildcards. Re-run /warp-allow-notify after changing this.
# notifyAllow:
#   - "slack:some_other_post_tool"
