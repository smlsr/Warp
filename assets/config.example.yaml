# Live state stays in the working copy and is gitignored.
# Use an absolute path to keep it outside the repo, for example
# /Users/you/.warp/humanifyos
stateDir: .warp

model: claude-sonnet-5-5-high
# Cursor model slug for coding steps. Claude Sonnet 5.5 High.
# The slug must match the Cursor model picker. Override it here.

maxAgents: 18
# Concurrent Shuttles. No per-person cap.

autoMergeSizes: [S, M]
# Sizes in this list auto-merge after Bugbot and CI. Sizes not in autoMergeSizes wait.

messenger: both
# slack | teams | both
notify: verbose
# verbose | quiet
runner: cloud
# cloud = Cursor cloud agent VM. local = this machine's agent.
# To run on this machine, comment out the line above and uncomment the next.
# runner: local

jiraProject: ""
# Jira project key, for example WAR. Leave this empty: /warp-init and /warp-scan
# fill it when one prefix is clear, when Jira shows one project, or when every
# stored issue key is in one project (even if the project-list tool is missing).
# A plan id is a Jira issue only when its prefix matches this or jiraKeyPrefixes.
# WV-01 is not WAR-1. Set it by hand only when the warning lists several candidates:
# python3 scripts/jira_sync.py project --set WAR
jiraKeyPrefixes: ""
# Extra project prefixes, comma-separated, that confirm a Jira key.
# jiraKeyPrefixes: "WAR, HOS"
jiraKeyMap: {}
# Optional plan-id to issue-key map. .warp/jira-map.json is merged on top.
# jiraKeyMap: {"WV-01": "WAR-1"}
jiraExternalIdField: externalId
# Field name or customfield id matched to the plan id. Tried first, then
# External ID, External Id, ExternalId, External Key, Plan ID, and Ticket ID.
# A label warp:<id> and a remote-link id are next. One exact hit is stored.
# A summary match waits for confirmation. Two matches are reported, not picked.
# jiraExternalIdField: "External ID"
# jiraExternalIdField: customfield_10050
jiraWriteExternalId: false
# true: /warp-scan and /warp-jira-check queue a write of the plan id into the
# Jira External ID field for every mapped ticket that is not already confirmed.
# The flag is the consent, so --yes is not required. A key found by the
# external-id search is skipped. false: scan and catchup never queue that write.
# /warp-jira-external-id --apply --yes still can. A different value already
# in that field is left alone unless --force-external-id. No comment is posted.
jiraExternalIdFieldName: "External ID"
# Name used when creating the field. Creation is off unless the next key is true.
jiraCreateExternalIdField: false
# true: when the field is missing, scan and /warp-jira-external-id may ask the
# agent to create a single-line text field. That is a site-wide Jira admin
# change. The Rovo MCP catalog has no create-field tool; if the probe finds
# none, or permission is denied, Warp does not fail. false: print the one
# command /warp-jira-external-id --create-field --yes and use the fallback.
jiraExternalIdFallback: label
# When the External ID field is missing: label (add warp:<id>, default),
# remote-link (createJiraIssueRemoteIssueLink), or none. label uses
# editJiraIssue update.labels add and does not remove other labels.
# .warp/jira-field.json remembers a missing field so the next scan prints
# one summary. --recheck looks again.
jiraTransition: true
# On claim, move the Jira issue to In Progress. Only tickets with a Jira key.
# Needs the Jira MCP server; without it Warp logs a note and the claim goes on.
jiraInProgressStatus: "In Progress"
# Target status name. The transition is looked up by name or status category.
jiraRestoreOnRelease: false
# true: when a claim is released back to queued, move the issue back to the status
# it had before. false: leave it. Pause and stop never move an issue.
jiraQaReadyStatus: "QA Ready"
# Manual path (sizes not in autoMergeSizes, any ticket with autoMerge false): the issue moves
# here when it is ready for a person to review and merge. It stays here until the
# merge. warp:proceed or a provider approval is what moves it on.
jiraDoneStatus: "Done"
# Status after a merge, auto or manual, connected or local.
jiraDoneOnManualMerge: true
# true: after a manual merge (warp:proceed or a provider approval), move Jira to
# jiraDoneStatus. false: leave the issue at jiraQaReadyStatus and let QA set Done.
# QA Ready is still the status while the ticket waits for approval.
jiraSite: ""
# Atlassian site URL, for example https://yoursite.atlassian.net. Passed as cloudId
# when you have more than one site. Empty: look the site up with getAccessibleAtlassianResources.
bugbotRequired: true
# Both paths. false: Bugbot is not required before auto-merge or before QA Ready.
bugbotManual: true
# Manual tickets (autoMerge false) only. true: Bugbot must pass before QA Ready,
# the same gate as auto-merge. false: skip Bugbot on that path. bugbotRequired
# still covers auto-merge.
maxFixAttempts: 3
stuckAfterMinutes: 90
respectMergeWindows: false
mergeWindows: ["08:30", "13:00", "17:00"]
pollSeconds: 300
reportOnComplete: true
# true: when every ticket is merged, done, skipped, blocked, or alarmed, or the run
# is stopped, write .warp/warp-complete.html and ask Herald to post the totals.
# false: write the file only when someone runs /warp-report.
reportPath: ".warp/warp-complete.html"
# Where the completion report is written, relative to the repo. The default is
# inside .warp, which /warp-init gitignores. A second copy is not made when this
# is already that path.

jiraMcp: atlassian
gitProvider: auto
# auto | github | bitbucket. auto reads the host of the origin remote, and
# /warp-init writes the one it finds. Other hosts run local-only.
# Uncomment one of these to force a provider, and comment out the line above.
# gitProvider: github
# gitProvider: bitbucket
githubMcp: github
bitbucketMcp: bitbucket
ghCli: true
# GitHub only: use the gh CLI when no GitHub server is connected, if gh is
# installed and logged in. Warp never installs gh or logs in.
# Uncomment to never try the gh CLI.
# ghCli: false
pushMerge: true
# true: connected mode, push branches, open and merge PRs through the provider.
# false: local-only. Never push, never open PRs, never call a provider; merge
# ticket branches into baseBranch with local git. No remote also means local.
# Uncomment for local-only: never push and never open a pull request.
# pushMerge: false
baseBranch: ""
# Branch tickets start from and merge into. Empty uses origin's default, then main or master.
# Uncomment to branch and merge into develop instead of the detected default.
# baseBranch: "develop"
slackMcp: slack
teamsMcp: teams
slackChannel: "warp"
teamsChannel: "warp"
# Channel to post into, and to watch for warp:status. One shared channel for
# every repo; each message names its repo in the header. Warp does not create
# the channel. Create it once, or change these to a channel that exists.
# Use lowercase: Slack channel names are lowercase.
projectName: ""
# Shown in message headers after the repo: "Warp | repo / project".
# Empty uses jiraProject, then the workspace folder name.
notifyAllow: []
# Extra MCP tools that may run without a Run prompt. Each entry is "server:tool".
# No wildcards. Re-run /warp-allow-notify after changing this.
# notifyAllow:
#   - "slack:some_other_post_tool"
autoAllowTools: true
# true: /warp-init writes .cursor/permissions.json so Slack and Jira calls Warp
# makes do not prompt. The list is specific tools, on the configured server
# name and the ids Cursor actually shows (user-, plugin-, and *name*).
# false: init skips that write. /warp-allow-notify still can.
# User-level ~/.cursor files are never written by init. Undo: /warp-allow-notify --revoke.
# /warp-init --no-allow skips one run without changing this key.
