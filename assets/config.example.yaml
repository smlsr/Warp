# Live state stays in the working copy and is gitignored.
# Use an absolute path to keep it outside the repo, for example
# /Users/you/.warp/humanifyos
stateDir: .warp

model: claude-sonnet-5-5-high
# Cursor model slug for coding steps. Claude Sonnet 5.5 High.
# The slug must match the Cursor model picker. Override it here.

# Two caps, and only two.
#   maxAgents      how many agents run at once
#   maxInProgress  how many tickets are open at once

maxAgents: 18
# Agents that run at once: every Shuttle, whatever its step (implement, fix,
# rebase, rerun, restart, repair), in a worktree on this machine or on its
# own VM. No per-person cap. A project may set 18. It is the one cap on
# running agents. There is no separate cap for fixes or for this machine.
# memoryCheck can lower it on a shared machine when memory is tight.

maxInProgress: 20
# Tickets that are open at once: started and not merged or parked. A ticket
# waiting on review or CI is open and uses no agent. At this count, nothing
# new is taken from the ready queue. This does not stop a fix, a rebase, a
# CI rerun, a Bugbot re-request, or a merge: those tickets are already
# open. Parked tickets do not count. Already being over the cap does not
# park or cancel anyone. Default 20.
# Status then says: holding new launches (N/maxInProgress), N fix workers running.
#
# Start and resume launch unfinished work first: open pull requests that
# need a fix (a conflict, CI that never started, red CI, then Bugbot
# findings), then tickets whose Shuttle was halted or died, then new
# tickets. All of it draws on maxAgents, so a new ticket starts only in a
# slot unfinished work did not need.

checkCommand: ""
# Optional. The orchestrator runs this on a rebased head before it merges.
# Empty: the required checks are Bugbot and CI as configured
# (bugbotRequired, bugbotManual). Warp does not invent a build command.
# `make ci` is a valid command. The space is part of the command.
# A red result is stored on pr.check and sent back to that ticket with the log.

appendOnlyPaths: []
# Shared files a ticket may append to, besides its lock paths. Empty by default.
# A conflict in one of these files keeps both sides, every added line.
# Any other conflict is sent back to that ticket's Agent. Nothing here is a special filename.

mergeQueue: false
# true: enqueue the pull request instead of merging it from the agent.
# false is the default. Warp also enqueues when GitHub says this repo uses a
# merge queue. A direct merge that branch protection rejects is not marked merged.

autoMergeSizes: [S, M]
# Sizes in this list auto-merge after Bugbot and CI. Sizes not in autoMergeSizes wait.

messenger: both
# slack | teams | both
notify: verbose
# verbose | quiet
runner: cloud
# cloud = this session is a cloud agent. local = this machine.
# auto = cloud when this session is a cloud agent, otherwise local.
# The runner is the main driver. local forces subagentVm false and launch worktree,
# skips the cloud-environment start check, and overrides other cloud-only settings.
# Start, /warp-version, and status print the effective values after that override.
# To run on this machine, comment out the line above and uncomment the next.
# runner: local
# runner: auto
launch: worktree
# worktree = one subagent per ticket in its own git worktree, in parallel up to maxAgents.
# agent = optional IMPLEMENT prompt for one new Agent, for a future Cursor Cloud Agents API.
# This plugin does not call that API. Clone main so .cursor rules load. A beam file
# does not have to exist on the branch before that Agent starts.
# launch: agent
worktreeRoot: .warp/worktrees
# Parent of ticket worktrees: <worktreeRoot>/<id>. The default is gitignored.
subagentVm: false
# false is the default: one git worktree per ticket on this machine.
# true, on a cloud runner: the prompt asks for a dedicated VM with its own
# clone and branch, not a git worktree on this machine. The subagent config
# has no isolation field. It fetches latest main, creates warp/<id>-<jira>,
# runs hostname and free -g first, and pushes .warp/tickets/<id>/ on that branch.
# The parent patches the beam from that folder. The same hostname is a worktree
# on this machine. One warning per run.
# runner: local forces false even when this line is true.
# Cloud subagents use the MCP servers at cursor.com/agents, not this session.
# In the Agents Window, /in-cloud is the manual fallback, one ticket at a time.
memoryCheck: false
# true: on a shared machine, free -g lowers maxAgents when available memory
# is under 2 GiB per extra subagent. At least one still runs. false: only
# maxAgents limits how many run at once, and free -g is not read.
cloudSnapshot: ""
# Snapshot id. With .cursor/environment.json, either one is a cloud environment.
# On a cloud runner, subagentVm true with neither warns and refuses /warp-start.
# --force allows the start and still warns.

jiraProject: ""
# Jira project key, for example WAR. Leave this empty: /warp-init and /warp-scan
# fill it when one prefix is clear, when Jira shows one project, or when every
# stored issue key is in one project (even if the project-list tool is missing).
# A plan id is a Jira issue only when its prefix matches this or jiraKeyPrefixes.
# WV-01 is not WAR-1. Set it by hand only when the warning lists several candidates:
# python3 scripts/jira_sync.py project --set WAR
jiraKeyPrefixes: ""
# Extra project prefixes, comma-separated, that confirm a Jira key.
# jiraKeyPrefixes: "WAR, HOS"
jiraKeyMap: {}
# Optional plan-id to issue-key map. .warp/jira-map.json is merged on top.
# jiraKeyMap: {"WV-01": "WAR-1"}
jiraExternalIdField: externalId
# Field name or customfield id matched to the plan id. Tried first, then
# External ID, External Id, ExternalId, External Key, Plan ID, and Ticket ID.
# A label warp:<id> and a remote-link id are next. One exact hit is stored.
# A summary match waits for confirmation. Two matches are reported, not picked.
# jiraExternalIdField: "External ID"
# jiraExternalIdField: customfield_10050
jiraWriteExternalId: false
# true: /warp-scan and /warp-jira-check queue a write of the plan id into the
# Jira External ID field for every mapped ticket that is not already confirmed.
# The flag is the consent, so --yes is not required. A key found by the
# external-id search is skipped. false: scan and catchup never queue that write.
# /warp-jira-external-id --apply --yes still can. A different value already
# in that field is left alone unless --force-external-id. No comment is posted.
jiraExternalIdFieldName: "External ID"
# Name used when creating the field. Creation is off unless the next key is true.
jiraCreateExternalIdField: false
# true: when the field is missing, scan and /warp-jira-external-id may ask the
# agent to create a single-line text field. That is a site-wide Jira admin
# change. The Rovo MCP catalog has no create-field tool; if the probe finds
# none, or permission is denied, Warp does not fail. false: print the one
# command /warp-jira-external-id --create-field --yes and use the fallback.
jiraExternalIdFallback: label
# When the External ID field is missing: label (add warp:<id>, default),
# remote-link (createJiraIssueRemoteIssueLink), or none. label uses
# editJiraIssue update.labels add and does not remove other labels.
# .warp/jira-field.json remembers a missing field so the next scan prints
# one summary. --recheck looks again.
jiraTransition: true
# On claim, move the Jira issue to In Progress. Only tickets with a Jira key.
# Needs the Jira MCP server; without it Warp logs a note and the claim goes on.
jiraInProgressStatus: "In Progress"
# Target status name. The transition is looked up by name or status category.
jiraRestoreOnRelease: false
# true: when a claim is released back to queued, move the issue back to the status
# it had before. false: leave it. Pause and stop never move an issue.
jiraQaReadyStatus: "QA Ready"
# Manual path (sizes not in autoMergeSizes, any ticket with autoMerge false): the issue moves
# here when it is ready for a person to review and merge. It stays here until the
# merge. warp:proceed or a provider approval is what moves it on.
jiraDoneStatus: "Done"
# Status after a merge, auto or manual, connected or local.
jiraDoneOnManualMerge: true
# true: after a manual merge (warp:proceed or a provider approval), move Jira to
# jiraDoneStatus. false: leave the issue at jiraQaReadyStatus and let QA set Done.
# QA Ready is still the status while the ticket waits for approval.
jiraSite: ""
# Atlassian site URL, for example https://yoursite.atlassian.net. Passed as cloudId
# when you have more than one site. Empty: look the site up with getAccessibleAtlassianResources.
bugbotRequired: true
# Both paths. false: Bugbot is not required before auto-merge or before QA Ready.
bugbotManual: true
# Manual tickets (autoMerge false) only. true: Bugbot must pass before QA Ready,
# the same gate as auto-merge. false: skip Bugbot on that path. bugbotRequired
# still covers auto-merge.
maxFixAttempts: 5
stuckAfterMinutes: 90
# Minutes with no progress before supervise marks that state stalled.
# Progress is a new commit, a phase change, or a check result change.
# A heartbeat, or a start that does not change those, does not clear the stall.
stallImplementingMinutes: 90
stallPrOpenMinutes: 20
stallReviewingMinutes: 45
stallFixingMinutes: 90
stallReadyMinutes: 30
stallMergingMinutes: 20
stallQueuedMinutes: 180
stallApprovalMinutes: 240
stallMinutes: 45
# Fallback for recovering and alarm, and for a state without its own key.
ciStartGraceMinutes: 5
# Minutes before a pull request head with zero check runs counts as CI that
# never started. supervise re-requests the workflow or pushes an empty commit
# in that pass. A conflict is rebased first. Default 5.
statusDigestMinutes: 60
# How often supervise posts one short Slack digest of alarms, stalls, and counts.
# A new stall or alarm posts once and is not posted again.
maxStallFixes: 5
# Fixer attempts for one stalled or alarmed ticket. Past this cap the ticket
# parks and Slack gets one alarm. Default 5.
repairSweepMinutes: 15
# How often supervise sweeps the whole run for broken tickets, pull requests,
# CI on main, locks, gates, the listener, and the beam. It skips a fix that
# is already queued or running, and starts what it can inside the slot cap.
# Slack posts only when the sweep starts something new or escalates. Default 15.
staleMinutes: 15
# A Shuttle is dead when lastSeenAt is older than this, or it never
# heartbeated and the claim is older than this. The watchdog replaces a dead
# Shuttle while the run is running. Pause and stop do not. A fresh heartbeat
# is left alone. A Shuttle whose turn returned this long ago and was not
# resumed reads reap: exit not-resumed if it wakes up. /warp-init appends
# this key when the file does not have it yet.
maxRecoveries: 5
# Dead Shuttle replacements on one ticket. Past this cap the ticket is alarm
# worker-died and no new Shuttle starts. Branch, pull request, and
# jira.startedAt stay. Default 5.
maxSpawnsPerTicket: 8
# New Shuttle spawns for one ticket. A resume of the Shuttle that returned
# does not count. Past this cap the ticket is alarm spawn-cap and no new
# Shuttle starts. Default 8.
maxSpawnsPerHour: 40
# New Shuttle and Bugbot spawns in the last 60 minutes, across the run.
# Past this cap no ticket starts a new agent until an hour has passed.
# Default 40.
alarmRepairMinutes: 15
# How often the parent pass looks for lock-escape alarms and starts one
# repair. Only while the run is running. Pause and stop do not repair.
# A repair already in flight is checked on each pass. /warp-init
# appends this key when the file does not have it yet.
maxAlarmRepairs: 5
# Repair attempts for one lock-escape ticket. Past this cap the alarm stays
# and later passes skip it. The repair widens that ticket's locks to the
# paths that escaped. Default 5.
respectMergeWindows: false
mergeWindows: ["08:30", "13:00", "17:00"]
pollSeconds: 300
# Seconds between channel reads. The listener is one poll: it reads Slack
# and Teams once and returns. The parent starts the next poll this many
# seconds after the last one finished. It is also the longest the parent
# waits between passes (orchestrator.py parent-exit --wait). Nothing sleeps
# in a loop. No slackChannel and no teamsChannel means no listener at all.
listenerStaleMinutes: 15
# A poll that was started and never reported back is issued again after
# this many minutes. The window is also at least one poll plus a minute.
# Pause and stop do not issue a poll. /warp-init appends this key when the
# file does not have it yet.
reportOnComplete: true
# true: when every ticket is merged, done, skipped, blocked, or alarmed, or the run
# is stopped, write .warp/warp-complete.html and ask Herald to post the totals.
# false: write the file only when someone runs /warp-report.
reportPath: ".warp/warp-complete.html"
# Where the completion report is written, relative to the repo. The default is
# inside .warp, which /warp-init gitignores. A second copy is not made when this
# is already that path.

jiraMcp: atlassian
gitProvider: auto
# auto | github | bitbucket. auto reads the host of the origin remote, and
# /warp-init writes the one it finds. Other hosts run local-only.
# Uncomment one of these to force a provider, and comment out the line above.
# gitProvider: github
# gitProvider: bitbucket
githubMcp: github
bitbucketMcp: bitbucket
ghCli: true
# GitHub only: use the gh CLI when no GitHub server is connected, if gh is
# installed and logged in. Warp never installs gh or logs in.
# Uncomment to never try the gh CLI.
# ghCli: false
pushMerge: true
# true: connected mode, push branches, open and merge PRs through the provider.
# false: local-only. Never push, never open PRs, never call a provider; merge
# ticket branches into baseBranch with local git. No remote also means local.
# Uncomment for local-only: never push and never open a pull request.
# pushMerge: false
baseBranch: ""
# Branch tickets start from and merge into. Empty uses origin's default, then main or master.
# Uncomment to branch and merge into develop instead of the detected default.
# baseBranch: "develop"
slackMcp: slack
teamsMcp: teams
slackChannel: "warp"
teamsChannel: "warp"
# Channel to post into, and to watch for warp:status. One shared channel for
# every repo; each message names its repo in the header. Warp does not create
# the channel. Create it once, or change these to a channel that exists.
# Use lowercase: Slack channel names are lowercase.
projectName: ""
# Shown in message headers after the repo: "Warp | repo / project".
# Empty uses jiraProject, then the workspace folder name.
notifyAllow: []
# Extra MCP tools that may run without a Run prompt. Each entry is "server:tool".
# No wildcards. Re-run /warp-allow-notify after changing this.
# notifyAllow:
#   - "slack:some_other_post_tool"
autoAllowTools: true
# true: /warp-init writes .cursor/permissions.json so Slack and Jira calls Warp
# makes do not prompt. The list is specific tools, on the configured server
# name and the ids Cursor actually shows (user-, plugin-, and *name*).
# false: init skips that write. /warp-allow-notify still can.
# User-level ~/.cursor files are never written by init. Undo: /warp-allow-notify --revoke.
# /warp-init --no-allow skips one run without changing this key.
