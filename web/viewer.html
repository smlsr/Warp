<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warp run dashboard</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 1680px; margin: 0 auto; padding: 0 20px; }
.hidden { display: none !important; }

/* top bar */
.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 14px; min-height: 58px; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.brand small { font-weight: 500; color: var(--muted); font-size: 13px; }
.meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); font-size: 12px; color: var(--ink2); white-space: nowrap; }
.chip b { font-weight: 600; color: var(--ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-todo); flex: none; }
.dot.running { background: var(--c-done); box-shadow: 0 0 0 0 color-mix(in srgb, var(--c-done) 60%, transparent); animation: pulse 2s infinite; }
.dot.paused { background: var(--c-qa); }
.dot.plan { background: var(--brand2); }
.dot.stopped { background: var(--c-todo); }
.dot.done { background: var(--brand2); }
@keyframes pulse { 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.actions { display: flex; gap: 6px; align-items: center; margin-left: auto; }

/* buttons and menu */
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line2); background: var(--panel); border-radius: 8px; font-size: 13px; font-weight: 500; }
.btn:hover { border-color: var(--brand2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.menu { position: relative; }
.menu-list { position: absolute; right: 0; top: 38px; min-width: 250px; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; box-shadow: var(--shadow-pop); padding: 6px; display: none; z-index: 40; }
.menu.open .menu-list { display: block; }
.menu-list button, .menu-list label { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px; border: 0; background: none; border-radius: 6px; text-align: left; font-size: 13px; cursor: pointer; }
.menu-list button:hover, .menu-list label:hover { background: var(--panel2); }
.menu-list kbd { margin-left: auto; color: var(--muted); font-size: 11px; font-family: inherit; }
.menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 5px 0; }

/* headline and tabs */
.headline { padding: 18px 0 6px; }
.headline h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; }
.headline .sub { color: var(--muted); margin-top: 3px; font-size: 13px; }
.headline .chain { color: var(--muted); margin-top: 3px; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs { display: flex; gap: 4px; margin-top: 12px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 12px; font-size: 13px; }
.tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* metric cards */
.metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 14px 0 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 12px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { margin: 0; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; justify-content: space-between; gap: 8px; }
.card h3 span { text-transform: none; letter-spacing: 0; font-weight: 500; }
.big { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
.big small { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.stack { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--panel2); border: 1px solid var(--line); }
.stack i { display: block; height: 100%; }
.rows { margin-top: 10px; display: grid; gap: 4px; font-size: 13px; }
.rows div { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
.rows .sw { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.rows .v { margin-left: auto; font-weight: 600; }
.rows .p { color: var(--muted); width: 42px; text-align: right; }
.foot { margin-top: 9px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.foot b { color: var(--ink2); font-weight: 600; }

/* controls */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 8px 0 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line2); background: var(--panel); font-size: 13px; }
.fchip .sw { width: 11px; height: 11px; border-radius: 3px; }
.fchip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.fchip.off { opacity: .42; }
.fchip.off .sw { background: transparent !important; outline: 1.5px solid var(--muted); }
.search { position: relative; flex: 1 1 220px; max-width: 340px; }
.search input { width: 100%; height: 32px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel); padding: 0 10px 0 30px; }
.search svg { position: absolute; left: 9px; top: 8px; width: 16px; height: 16px; color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: none; height: 30px; padding: 0 11px; font-size: 13px; }
.seg button.on { background: var(--panel2); font-weight: 600; box-shadow: inset 0 -2px 0 var(--brand2); }
.ctl { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.ctl select { height: 30px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel); padding: 0 6px; }
.ctl input[type=range] { width: 110px; accent-color: var(--brand); }

/* panels and utilization */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 18px; overflow: hidden; }
.panel-h { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-h h2 { margin: 0; font-size: 15px; }
.panel-h .muted { color: var(--muted); font-size: 12px; }
.clock { margin-left: auto; }
.util > summary { padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: 13px; list-style: none; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.util > summary::-webkit-details-marker { display: none; }
.util > summary .muted { color: var(--muted); font-weight: 500; }
.util-b { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 18px; padding: 4px 14px 14px; }
.meter { display: grid; gap: 10px; align-content: start; font-size: 13px; }
.meter .row { display: grid; grid-template-columns: 170px 1fr 96px; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
.meter .bar0 { height: 8px; border-radius: 99px; background: var(--panel2); border: 1px solid var(--line); overflow: hidden; }
.meter .bar0 i { display: block; height: 100%; background: var(--brand2); }
.meter .bar0 i.over { background: var(--c-qa); }
.meter .v { text-align: right; font-weight: 600; }
table.mini { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.mini th, table.mini td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; }
table.mini th:first-child, table.mini td:first-child { text-align: left; }
table.mini th { color: var(--muted); font-weight: 600; font-size: 11.5px; }
.assume { margin-top: 6px; font-size: 12px; color: var(--muted); }
.assume summary { cursor: pointer; color: var(--ink2); }
.assume ul { margin: 6px 0 0; padding-left: 18px; }
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--panel2); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.pill.green { background: color-mix(in srgb, var(--c-done) 18%, transparent); color: var(--c-done); }
.pill.red { background: color-mix(in srgb, var(--c-err) 18%, transparent); color: var(--c-err); }
.tlnote { color: var(--muted); font-size: 12px; }

/* overlays: scrim, drawer shell, drop, toasts, tooltip */
.scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 50; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100vw); background: var(--panel); border-left: 1px solid var(--line); z-index: 51; transform: translateX(100%); transition: transform .18s ease; display: flex; flex-direction: column; }
body.drawer-open .scrim { opacity: 1; pointer-events: auto; }
body.drawer-open .drawer { transform: none; }
.drop { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; background: color-mix(in srgb, var(--brand) 22%, transparent); backdrop-filter: blur(2px); }
.drop div { background: var(--panel); border: 2px dashed var(--brand); border-radius: 16px; padding: 30px 40px; font-size: 18px; font-weight: 600; }
body.dragging .drop { display: flex; }
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 70; display: grid; gap: 8px; }
.toast { background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 9px; font-size: 13px; box-shadow: var(--shadow-tip); max-width: 420px; }
.toast.err { background: var(--c-err); color: var(--on-err); }
.tip { position: fixed; z-index: 45; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 12px; max-width: 320px; box-shadow: var(--shadow-tip); display: none; }
.tip b { font-size: 13px; }
.tip .m { opacity: .75; }

/* empty state */
.empty { margin: 40px auto; max-width: 720px; text-align: center; padding: 48px 28px; border: 2px dashed var(--line2); border-radius: 16px; background: var(--panel); }
.empty h2 { margin: 12px 0 6px; font-size: 20px; }
.empty p { color: var(--muted); margin: 6px 0; }
.empty .row { display: flex; gap: 8px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
.empty code { background: var(--panel2); padding: 1px 6px; border-radius: 5px; font-size: 12.5px; }
.foot-note { color: var(--muted); font-size: 12px; padding: 4px 0 30px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

@media (max-width: 1100px) { .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) { .util-b { grid-template-columns: 1fr; } .meter .row { grid-template-columns: 120px 1fr 80px; } }

/* phone */
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  .metrics { grid-template-columns: 1fr; }
  .actions .lbl { display: none; }
  .lane-h .stack { display: none; }
  .tl-lab { width: 54px; }
  .top { position: static; }
  .top .wrap { gap: 8px; }
  .brand { order: 1; }
  .actions { order: 2; }
  .meta { order: 3; flex-basis: 100%; }
  .hide-sm { display: none; }
  .headline .chain { max-width: 100%; }
  .search { max-width: none; flex-basis: 100%; }
  .controls { min-width: 0; }
  .empty { margin: 24px auto; padding: 32px 18px; }
}

/* print */
@media print {
  @page { size: landscape; margin: 10mm; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { background: var(--bg); font-size: 12px; }
  .util > summary, .clock, .top .actions, .controls .search, .controls .ctl, .controls .seg, .tabs, .drawer, .scrim, .toasts, .drop, .tip { display: none !important; }
  .top { position: static; backdrop-filter: none; }
  .wrap { max-width: none; padding: 0; }
  .card, .panel { box-shadow: none; break-inside: avoid; }
  .tl-scroll { overflow: visible; max-height: none; }
  .tl-head, .tl-lab { position: static; }
  .lane { break-inside: auto; }
  .lane.closed .lane-b { display: grid; }
  .tcard { break-inside: avoid; }
  .bar:hover { box-shadow: none; }
}

:root {
  --bg: #f4f6f7;
  --panel: #ffffff;
  --panel2: #eef2f3;
  --ink: #0e1719;
  --ink2: #2b3a3e;
  --muted: #5d6d72;
  --line: #dbe2e4;
  --line2: #c6d0d3;
  --brand: #0b6e6e;
  --brand2: #43b3ad;
  --focus: #43b3ad;
  --c-done: #1f9d55;
  --c-err: #d64545;
  --c-prog: #2f6fde;
  --c-rev: #8b5cf6;
  --c-qa: #d99a00;
  --c-todo: #8c99a5;
  --tint: 16%;
  --tint-todo: 10%;
  --on-brand: #ffffff;
  --on-err: #ffffff;
  --shadow: 0 1px 2px rgba(14, 23, 25, .06), 0 2px 8px rgba(14, 23, 25, .05);
  --shadow-pop: 0 10px 30px rgba(0, 0, 0, .18);
  --shadow-tip: 0 8px 24px rgba(0, 0, 0, .25);
  --scrim: rgba(5, 10, 12, .35);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1214;
    --panel: #111b1e;
    --panel2: #162327;
    --ink: #e7eff0;
    --ink2: #c8d5d8;
    --muted: #8fa3a8;
    --line: #22343a;
    --line2: #2c434a;
    --brand: #43b3ad;
    --brand2: #6fd0ca;
    --c-done: #34c172;
    --c-err: #f06363;
    --c-prog: #5b8ff0;
    --c-rev: #a587ff;
    --c-qa: #f0b429;
    --c-todo: #73828d;
    --tint: 24%;
    --tint-todo: 16%;
    --on-brand: #071012;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0b1214;
  --panel: #111b1e;
  --panel2: #162327;
  --ink: #e7eff0;
  --ink2: #c8d5d8;
  --muted: #8fa3a8;
  --line: #22343a;
  --line2: #2c434a;
  --brand: #43b3ad;
  --brand2: #6fd0ca;
  --c-done: #34c172;
  --c-err: #f06363;
  --c-prog: #5b8ff0;
  --c-rev: #a587ff;
  --c-qa: #f0b429;
  --c-todo: #73828d;
  --tint: 24%;
  --tint-todo: 16%;
  --on-brand: #071012;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

@media print {
  :root:root:root,
  :root:root[data-theme="dark"],
  :root:root[data-theme="light"] {
    --bg: #ffffff;
    --panel: #ffffff;
    --panel2: #f1f4f5;
    --ink: #0e1719;
    --ink2: #2b3a3e;
    --muted: #5d6d72;
    --line: #dbe2e4;
    --line2: #c6d0d3;
    --brand: #0b6e6e;
    --brand2: #43b3ad;
    --c-done: #1f9d55;
    --c-err: #d64545;
    --c-prog: #2f6fde;
    --c-rev: #8b5cf6;
    --c-qa: #d99a00;
    --c-todo: #8c99a5;
    --tint: 18%;
    --tint-todo: 10%;
    --on-brand: #ffffff;
    --shadow: none;
    color-scheme: light;
  }
}

/* board */
.lane { margin-bottom: 14px; }
.lane-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; user-select: none; }
.lane-h .chev { transition: transform .15s; color: var(--muted); flex: none; }
.lane.closed .chev { transform: rotate(-90deg); }
.lane.closed .lane-b { display: none; }
.lane-h h2 { margin: 0; font-size: 15px; }
.lane-h .gname { color: var(--muted); font-weight: 500; }
.lane-h .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }
.lane-h .stat { margin-left: auto; display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.lane-h .stack { width: 140px; }
.lane-b { padding: 0 14px 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 10px; }
.tcard { position: relative; border-radius: 9px; padding: 9px 11px 9px 14px; background: color-mix(in srgb, var(--c) calc(var(--tint) * .7), var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 35%, var(--line)); cursor: pointer; min-width: 0; }
.tcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 9px 0 0 9px; background: var(--c); }
.tcard.crit { box-shadow: inset 0 0 0 1.5px var(--ink); }
.tcard .l1 { display: flex; gap: 6px; align-items: center; }
.tcard .id { font-weight: 700; }
.tcard .badge { font-size: 10.5px; font-weight: 600; border: 1px solid var(--line2); border-radius: 5px; padding: 0 5px; color: var(--ink2); background: var(--panel); }
.tcard .st { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--c); white-space: nowrap; }
.tcard .tt { margin: 4px 0 6px; font-size: 13px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 35px; }
.tcard .tt .none { color: var(--muted); }
.tcard .l3 { display: flex; gap: 10px; font-size: 12px; color: var(--muted); align-items: center; flex-wrap: wrap; }
.tcard .l3 a { font-weight: 600; }
.tcard .alarm { margin-top: 6px; font-size: 12px; color: var(--c-err); font-weight: 600; overflow-wrap: anywhere; }
.empty-lane { color: var(--muted); font-size: 13px; padding: 4px 0 6px; }

.fchip { cursor: pointer; user-select: none; }
.fchip:hover { background: var(--panel2); }
.fchip.off .n { text-decoration: line-through; }
.seg button { cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel2); font-weight: 600; }
.search input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.ctl select, .ctl input[type=range] { cursor: pointer; }
.menu-list [role="menuitem"]:focus-visible, .menu-list label:focus-within { outline: 2px solid var(--focus); outline-offset: -2px; }
@media (max-width: 640px) {
  .search { flex-basis: 100%; max-width: none; }
  .controls .legend { flex-basis: 100%; }
}

.drawer-h { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); position: relative; }
.drawer-h::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); }
.drawer-h .id { font-size: 18px; font-weight: 700; }
.drawer-h .tt { margin-top: 2px; font-size: 14px; color: var(--ink2); }
.drawer-h .x { position: absolute; right: 12px; top: 12px; }
.drawer-b { padding: 12px 18px 24px; overflow: auto; }
.kv { display: grid; grid-template-columns: 128px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.drawer h4 { margin: 18px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.dv-raw { color: var(--muted); }
.dv-alarm { color: var(--c-err); }
.dv-checks { margin: 0; padding-left: 18px; font-size: 13px; }
.ev { font-size: 12px; display: grid; grid-template-columns: 112px 1fr; gap: 3px 10px; }
.ev .t { color: var(--muted); font-variant-numeric: tabular-nums; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 5px; background: var(--panel2); border: 1px solid var(--line); }

/* header: meta chips, tabs and the plugin actions row (SPEC §10.1-§10.4) */
.meta .dot.done { background: var(--brand); }
.tab { cursor: pointer; }
.tab:not(.on):hover { border-color: var(--line2); }
#actionsBar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; padding-bottom: 8px; }
.hdr-act { display: inline-flex; align-items: center; gap: 6px; }

@media (max-width: 640px) {
  #actionsBar { justify-content: flex-start; }
}

@media print {
  #actionsBar { display: none; }
}

/* swimlane */
.tl-scroll { overflow: auto; max-height: calc(100vh - 150px); position: relative; }
.tl { position: relative; min-width: 100%; }
.tl-row { display: flex; height: var(--rowh, 46px); border-bottom: 1px solid var(--line); }
.tl-row:nth-child(even) .tl-track { background: color-mix(in srgb, var(--panel2) 45%, transparent); }

.tl-track { position: relative; flex: none; }

.tl-head .tl-row { height: 26px; }
.tl-head .tl-row.gates { height: 38px; }
.tl-axis span { position: absolute; top: 6px; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.tl-axis span::before { content: ""; position: absolute; left: 50%; top: -6px; height: 4px; border-left: 1px solid var(--line2); }
.gl { position: absolute; bottom: 3px; transform: translateX(-100%); padding-right: 4px; font-size: 11px; font-weight: 700; white-space: nowrap; color: var(--ink2); line-height: 1.15; text-align: right; }
.gl.red { color: var(--c-err); }
.gl.green { color: var(--c-done); }
.gl small { display: block; font-weight: 500; color: var(--muted); }
.gline { position: absolute; top: 0; bottom: 0; border-left: 1.5px solid var(--ink2); opacity: .55; z-index: 3; pointer-events: none; }
.gline.red { border-left: 3px solid var(--c-err); opacity: .9; }
.gline.green { border-left-color: var(--c-done); }
.grid-v { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); opacity: .7; pointer-events: none; }
.nowline { position: absolute; top: 0; bottom: 0; border-left: 2px dashed var(--c-prog); z-index: 3; pointer-events: none; }
.bar { position: absolute; top: 4px; bottom: 4px; border-radius: 5px; overflow: hidden; cursor: pointer; padding: 3px 7px 0 9px; font-size: 11px; line-height: 1.3;
  background: color-mix(in srgb, var(--c) var(--tint), var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 45%, var(--panel)); transition: opacity .15s, transform .1s; }
.bar::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.bar.c-todo { background: color-mix(in srgb, var(--c) var(--tint-todo), var(--panel)); }
.bar.crit { border: 2px solid var(--ink); }
.bar:hover { z-index: 5; box-shadow: var(--shadow-pop); }
.bar .l1 { display: flex; gap: 6px; align-items: baseline; white-space: nowrap; }
.bar .id { font-weight: 700; color: var(--ink); }
.bar .sz { margin-left: auto; color: var(--muted); font-size: 10px; }
.bar .tt { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 10.5px; }

.bar.tiny .id { font-size: 9px; }

.bar.hit { outline: 2px solid var(--focus); outline-offset: 1px; z-index: 6; }

}

@media print {

  .bar:hover { box-shadow: none; }
}

    const menuOpen = () => {
      const m = $("#fileMenu");
      return !!m && m.classList.contains("open");
    };
    function act(name) {
      setMenu(false);
      if (name === "open-files") return pick3(openFiles);
      if (name === "open-folder") return pick3(openFolder);
      if (name === "reload") return reload2();
      if (name === "auto-reload") {
        auto.toggle();
        return renderControls();
      }
      if (name === "print") return print();
      if (name === "clear") {
        closeDrawer();
        store.set({ runs: [], docs: [], sources: [], embedded: null, tab: "all", loadedAt: null }, "clear");
      }
      return null;
    }
    function toggleLane(head) {
      const lane = head.closest(".lane");
      if (!lane) return;
      const closed = lane.classList.toggle("closed");
      S.closed = setLaneClosed(S.closed, lane.dataset.lane, closed);
      head.setAttribute("aria-expanded", String(!closed));
    }
    const inside = (t) => !!t && (root === doc || root.contains(t));
    const elOf = (e) => (e.target && e.target.nodeType === 1 ? e.target : e.target && e.target.parentElement) || null;
    on(doc, "click", (e) => {
      const t = elOf(e);
      if (!inside(t)) return;
      const a = t.closest("[data-act]");
      if (a && !t.closest("#drawer, #actionsBar")) {
        act(a.dataset.act);
        return;
      }
      if (t.closest("#fileBtn")) {
        setMenu(!menuOpen());
        return;
      }
      if (!t.closest("#fileMenu")) setMenu(false);
      if (t.closest("#drawerClose, #scrim")) return closeDrawer();
      if (t.closest("#reloadBtn")) return void reload2();
      if (t.closest("#printBtn")) return print();
      if (t.closest("#themeBtn")) {
        const theme = toggleTheme(S, prefs, media("(prefers-color-scheme: dark)")).theme;
        applyTheme(theme);
        return store.set({ theme }, "theme");
      }
      const chip2 = t.closest("#legend .fchip[data-cat]");
      if (chip2) return store.set({ off: toggleCat(S, chip2.dataset.cat).off }, "filter");
      const tab = t.closest("#tabs [data-tab]");
      if (tab) return store.set({ tab: tab.dataset.tab }, "tab");
      const clock = t.closest("#view [data-clock]");
      if (clock) {
        const c = clock.dataset.clock === "actual" ? "actual" : "plan";
        prefs.set("clock", c);
        return store.set({ clock: c }, "clock");
      }
      const th = t.closest("#view th[data-sort]");
      if (th) {
        const key = th.dataset.sort;
        const refocus = doc.activeElement === th;
        store.set({ sort: nextSort(S.sort, key) }, "sort");
        const again = refocus ? $(`#view th[data-sort="${key}"]`) : null;
        if (again) again.focus();
        return;
      }
      const v = t.closest("#viewSeg [data-view]");
      if (v) return store.set({ view: switchView(S, v.dataset.view, prefs).view }, "view");
      const lh = t.closest("#view .lane-h");
      if (lh) return toggleLane(lh);
      const tk = t.closest("#view .bar, #view .tcard, #view .trow");
      if (tk && !t.closest("a")) {
        ui.opener = tk;
        openDrawer(tk.dataset.run, tk.dataset.id);
      }
    });
    on(doc, "dblclick", (e) => {
      const t = elOf(e);
      if (!inside(t)) return;
      const chip2 = t.closest("#legend .fchip[data-cat]");
      if (chip2) store.set({ off: onlyCat(S, chip2.dataset.cat).off }, "filter");
    });
    on(doc, "keydown", (e) => {
      const t = elOf(e) || doc.body;
      if (!inside(t)) return;
      const typing = TYPING2.test(t.tagName || "") || t.isContentEditable;
      if (!typing) {
        const ctrl = e.ctrlKey || e.metaKey;
        for (const k of hooks.keys) {
          if (!k || typeof k.run !== "function" || k.key !== e.key) continue;
          if (!!k.ctrl !== ctrl || k.shift != null && !!k.shift !== e.shiftKey) continue;
          e.preventDefault();
          safe(() => k.run(e, ctx()));
          return;
        }
      }
      let action = keyAction(e);
      if (!action && (e.key === "Enter" || e.key === " ") && t.matches("#view .bar")) action = "activate";
      if (!action) return;
      if (action === "escape") {
        setMenu(false);
        hideTip();
        if (ui.drawer) closeDrawer();
        return;
      }
      e.preventDefault();
      if (action === "activate") t.click();
      else if (action === "focus-search") {
        const q = $("#q");
        if (q) q.focus();
      } else act(action);
    });
    on(doc, "input", (e) => {
      const t = elOf(e);
      if (!inside(t)) return;
      if (t.id === "q") store.set({ q: setQuery(S, t.value).q }, "filter");
      else if (t.id === "zoom") store.set({ zoom: setZoom(S, t.value, prefs).zoom }, "zoom");
    });
    on(doc, "change", (e) => {
      const t = elOf(e);
      if (!inside(t)) return;
      if (t.id === "groupBy") store.set({ groupBy: setGroupBy(S, t.value, prefs).groupBy }, "group");
      else if (t.id === "colorBy") store.set({ colorBy: setColorBy(S, t.value, prefs).colorBy }, "color");
      else if (t.id === "autoRefresh") auto.set(t.checked);
    });
    on(doc, "mouseover", (e) => {
      const t = elOf(e);
      const b = t && t.closest("#view .bar");
      if (b) showTip(e, b);
    });
    on(doc, "mousemove", (e) => {
      const t = elOf(e);
      const b = t && t.closest("#view .bar");
      if (b) showTip(e, b);
      else hideTip();
    });
    const hasFiles = (e) => !!e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files");
    on(win, "dragenter", (e) => {
      if (!hasFiles(e)) return;
      ui.dragDepth++;
      doc.body.classList.add("dragging");
      e.preventDefault();
    });
    on(win, "dragover", (e) => e.preventDefault());
    on(win, "dragleave", () => {
      ui.dragDepth = Math.max(0, ui.dragDepth - 1);
      if (!ui.dragDepth) doc.body.classList.remove("dragging");
    });
    on(win, "drop", (e) => {
      e.preventDefault();
      ui.dragDepth = 0;
      doc.body.classList.remove("dragging");
      if (!e.dataTransfer) return;
      sourcesFromDrop(e.dataTransfer).then((sources) => sources.length ? loadSources(sources) : toast("No .json files in what was dropped.", true)).catch((err) => toast("Could not read the drop: " + reasonOf(err), true));
    });
    on(win, "resize", () => {
      win.clearTimeout(ui.resizeT);
      ui.resizeT = win.setTimeout(() => {
        if (S.runs.length && S.view === "timeline") render("resize");
      }, RESIZE_MS);
    });
    on(win, "beforeprint", () => {
      const u = $("#util");
      if (u) {
        ui.utilWasOpen = u.open;
        ui.noStore = true;
        u.open = true;
      }
      if (S.view === "timeline" && S.runs.length) store.set({ printing: true }, "print");
    });
    on(win, "afterprint", () => {
      const u = $("#util");
      if (u) u.open = !!ui.utilWasOpen;
      win.setTimeout(() => {
        ui.noStore = false;
      }, 0);
      if (S.printing) store.set({ printing: false }, "print");
    });
    const utilEl = $("#util");
    if (utilEl) {
      utilEl.open = prefs.get("util") === "1";
      on(utilEl, "toggle", () => {
        if (!ui.noStore) prefs.set("util", utilEl.open ? "1" : "");
      });
    }
    function destroy() {
      for (const [target, type, fn, opts] of ui.listeners) target.removeEventListener(type, fn, opts);
      ui.listeners = [];
      auto.stop();
      win.clearTimeout(ui.resizeT);
      if (apps.get(doc) === app) apps.delete(doc);
    }
    const app = {
      root,
      plugins: plugList,
      hooks,
      store,
      recompute: (run) => store.recompute(run),
      render,
      openDrawer,
      closeDrawer,
      toast,
      reload: reload2,
      load: (docs2, opts) => loadDocs(docs2, opts),
      destroy
    };
    apps.set(doc, app);
    const empty = $("#emptyState");
    if (empty) empty.innerHTML = renderEmpty();
    applyTheme(S.theme);
    store.subscribe((_, reason) => render(reason));
    for (const p of plugList) if (typeof p.init === "function") safe(() => p.init(app));
    const docs = embeddedDocs(doc);
    if (docs.length) {
      const payload = embeddedPayload(doc) || {};
      const embedded = { repo: payload.repo || null, jiraSite: payload.jiraSite || "", generatedAt: parseTime(payload.generatedAt) };
      if (!loadDocs(docs, { quiet: true, embedded })) render("init");
    } else render("init");
    return app;
  }
  if (typeof document !== "undefined" && document.getElementById("warp-data")) {
    createApp({ root: document });
  }
})();
</script>
</body>
</html>
